<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>שקשוקה סיטי</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: full-screen 3D city; chunky counter cards top, action bar bottom, a bottom sheet for residents */
:root{
  --sky:#a9d9f2; --cream:#fff6e2; --ink:#2a1d17; --tomato:#d63b22; --yolk:#ffb51f; --parsley:#3f8f3a; --muted:#7a6a5c;
  --display:"Rubik","Assistant",system-ui,sans-serif;
  --body:"Assistant","Rubik",system-ui,sans-serif;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--body);direction:rtl;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;display:grid;justify-items:center;gap:8px;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#cityBanner{pointer-events:auto;cursor:default;-webkit-tap-highlight-color:transparent}
.banner{font-family:var(--display);font-weight:800;font-size:22px;background:var(--tomato);color:var(--cream);padding:6px 18px;border-radius:12px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stat{display:flex;align-items:center;gap:8px;background:var(--cream);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:4px 12px 4px 8px}
.stat b{font-family:var(--display);font-weight:800;font-size:24px;color:var(--parsley);font-variant-numeric:tabular-nums}
.stat span{font-family:var(--display);font-weight:700;font-size:17px}
.dot{width:26px;height:26px;border-radius:50%;background:var(--parsley);display:grid;place-items:center}
.dot i{display:block;width:12px;height:12px;border-radius:50%;background:var(--yolk);box-shadow:0 0 0 4px #fff}
.dot.pan i{width:14px;height:10px;border-radius:3px;background:var(--tomato);box-shadow:0 0 0 3px #222}
.note{font-size:13px;background:rgba(255,246,226,.92);border-radius:8px;padding:3px 10px;color:var(--muted)}
.bar{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:0;right:0;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{font-family:var(--display);font-weight:700;font-size:16px;padding:10px 16px;border-radius:999px;border:3px solid var(--ink);background:var(--cream);color:var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer}
.btn.primary{background:var(--yolk)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}
.party{font-family:var(--display);font-weight:800;font-size:18px;background:linear-gradient(90deg,#ff5fa2,#ffb51f,#5fd3ff);color:var(--ink);padding:5px 16px;border-radius:999px;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px) rotate(-1deg)}}
.admin{display:grid;gap:10px;padding:10px;border:2px dashed #d8c39a;border-radius:14px;background:#fffaf0}
.admin .sec{display:grid;gap:6px;min-width:0}
#partyForm input{width:0}
#partyForm .btn{flex:none;padding:10px 14px}
.admin .sec>b{font-family:var(--display);font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font-family:var(--body);font-weight:700;font-size:15px;padding:7px 14px;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.item button.mv{font-weight:700;color:var(--ink);padding:4px 8px}
.party[hidden],#adminBox[hidden],.sheet[hidden],.note[hidden],.filmhint[hidden],.welcome[hidden],#adminGate[hidden],.btn[hidden],form[hidden]{display:none!important}
.welcome{position:fixed;inset:0;display:grid;place-items:center;background:rgba(42,29,23,.35);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wcard{width:100%;max-width:360px;display:grid;gap:12px;justify-items:center;text-align:center;background:var(--cream);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);border-radius:22px;padding:22px 20px}
.wcard h1{margin:0;font-family:var(--display);font-weight:800;font-size:26px;line-height:1.15;text-wrap:balance}
.wcard p{margin:0;font-size:17px;color:var(--muted);line-height:1.45}
.wcard input{width:100%;box-sizing:border-box;font-family:var(--body);font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid var(--ink);background:#fff;color:var(--ink);text-align:center}
.wcard .btn{width:100%;font-size:19px}
.wcard .btn:disabled{opacity:.6}
.linkbtn{border:0;background:none;color:var(--muted);font-family:var(--body);font-size:15px;text-decoration:underline;cursor:pointer;padding:4px}
.wegg{width:70px;height:54px;border-radius:50% 50% 46% 54%/60% 60% 40% 40%;background:#fffdf6;border:3px solid var(--ink);display:grid;place-items:center}
.wegg i{width:28px;height:28px;border-radius:50%;background:var(--yolk);border:3px solid var(--ink)}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:62%;display:flex;flex-direction:column;background:var(--cream);border-top:3px solid var(--ink);border-radius:20px 20px 0 0;padding-block:14px calc(env(safe-area-inset-bottom,0px) + 14px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:10px;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet h2{margin:0;font-family:var(--display);font-weight:800;font-size:20px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;font-family:var(--body);font-size:17px;padding:10px 12px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink)}
.list{overflow-y:auto;display:grid;gap:6px;min-height:0}
.item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border:2px solid #e6d8bd;border-radius:12px}
.item .n{flex:1;min-width:0;font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .num{font-family:var(--display);color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.item button{font-family:var(--body);font-size:14px;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:8px}
.item button.go{color:var(--parsley);font-weight:700}
.item button.del.armed{background:var(--tomato);color:#fff}
.empty{color:var(--muted);font-size:15px;line-height:1.5;padding:6px 2px}
.msg{font-size:14px;color:var(--tomato);min-height:1em}
.toast{position:fixed;top:34%;left:50%;transform:translate(-50%,-50%) scale(.85);background:var(--cream);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);border-radius:16px;padding:10px 18px;font-family:var(--display);font-weight:800;font-size:22px;text-align:center;opacity:0;transition:opacity .3s,transform .3s cubic-bezier(.3,1.6,.5,1);pointer-events:none;max-width:86vw}
.toast small{display:block;font-family:var(--body);font-weight:600;font-size:15px;color:var(--muted)}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
body.film .top .note,body.film .bar,body.film .sheet,body.film .welcome{display:none!important}
.filmhint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:50%;transform:translateX(-50%);font-size:13px;color:rgba(42,29,23,.55)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

</head><body>
<canvas id="c" aria-label="עיר תלת-ממדית של בתי שקשוקה"></canvas>

<div class="top">
  <div class="banner" id="cityBanner">שקשוקה סיטי</div>
  <div class="stats">
    <div class="stat"><div class="dot pan"><i></i></div><b id="nHouses">0</b><span>בתים</span></div>
    <div class="stat"><div class="dot"><i></i></div><b id="nEggs">0</b><span>ביצים</span></div>
  </div>
  <div class="party" id="partyBanner" hidden></div>
  <div class="note" id="note" hidden></div>
</div>

<div class="bar" id="bar">
  <button class="btn primary" id="addRes" type="button" hidden>הוסף תושב</button>
  <button class="btn primary" id="myHouse" type="button" hidden>הבית שלי</button>
  <button class="btn" id="openList" type="button">תושבים</button>
  <button class="btn" id="film" type="button">מצב צילום</button>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="row" style="align-items:center;justify-content:space-between">
    <h2 id="sheetTitle">תושבי העיר</h2>
    <button class="btn" id="closeSheet" type="button" style="padding:6px 14px;font-size:14px">סגירה</button>
  </div>
  <div class="admin" id="adminBox" hidden>
    <div class="sec"><b>מסיבה בעיר</b>
      <form class="row" id="partyForm" autocomplete="off"><input id="partyTitle" maxlength="40" placeholder="שם המסיבה" aria-label="שם המסיבה"><button class="btn primary" id="partyBtn" type="submit">מתחילים!</button></form>
    </div>
    <div class="sec"><b>אווירה בעיר</b><div class="chips" id="themeChips"><button type="button" data-theme="day">יום</button><button type="button" data-theme="sunset">שקיעה</button><button type="button" data-theme="night">לילה</button></div></div>
  </div>
  <form class="row" id="addForm" autocomplete="off">
    <input id="nameInput" maxlength="30" placeholder="שם או @שם משתמש" aria-label="שם התושב החדש">
    <button class="btn primary" type="submit">הוספה</button>
  </form>
  <div class="row"><input id="searchInput" placeholder="חיפוש בית לפי שם" aria-label="חיפוש תושב"></div>
  <button class="btn primary" id="saveSite" type="button" hidden>בדיקת שמירה בענן</button>
  <div class="msg" id="msg"></div>
  <div class="list" id="list"></div>
</div>

<div class="toast" id="toast"></div>
<div class="welcome" id="adminGate" hidden>
  <form class="wcard" id="gateForm" autocomplete="off">
    <h1>כניסת מנהל</h1>
    <p>כתבו את קוד המנהל</p>
    <input id="gateCode" maxlength="30" aria-label="קוד מנהל">
    <div class="msg" id="gateMsg"></div>
    <button class="btn primary" type="submit">כניסה</button>
    <button class="linkbtn" id="gateCancel" type="button">ביטול</button>
  </form>
</div>
<div class="welcome" id="welcome" hidden>
  <form class="wcard" id="welcomeForm" autocomplete="off">
    <div class="wegg" aria-hidden="true"><i></i></div>
    <h1>ברוכים הבאים לשקשוקה סיטי</h1>
    <p>כל תושב מקבל בית משלו בעיר. מה השם המלא שלך?</p>
    <input id="fullName" maxlength="30" placeholder="שם פרטי ושם משפחה" aria-label="שם מלא">
    <div class="msg" id="welcomeMsg"></div>
    <button class="btn primary" id="welcomeBtn" type="submit">בנו לי בית</button>
    <button class="linkbtn" id="skipWelcome" type="button">רק להסתכל</button>
  </form>
</div>
<div class="filmhint" id="filmhint" hidden>לחיצה על המסך יוצאת ממצב צילום</div>

<script src="vendor/three.min.js"></script>
<script>
(function(){
const P=18, BLOCK=14, G=5, RIVER_Z=(G+1)*P, RIVER_W=16;
const $=id=>document.getElementById(id);

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed||1;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(42);

// Renderer & scene
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xa9d9f2);
scene.fog=new THREE.Fog(0xa9d9f2,160,330);
const camera=new THREE.PerspectiveCamera(45,1,2,800);
const hemi=new THREE.HemisphereLight(0xffffff,0x9a8a6a,0.6);scene.add(hemi);let partyOn=false;
const sun=new THREE.DirectionalLight(0xfff1d6,0.8);
sun.position.set(60,110,40);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-0.0008;sun.shadow.normalBias=0.35;
Object.assign(sun.shadow.camera,{left:-130,right:130,top:130,bottom:-130,near:10,far:300});
scene.add(sun);

const M=c=>new THREE.MeshStandardMaterial({color:c,flatShading:true,roughness:.85});
function canvasTex(w,h,draw){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');draw(x,w,h);const t=new THREE.CanvasTexture(cv);t.anisotropy=4;return t}
function roundRect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function sign(title,sub,w,h){
  const tex=canvasTex(512,256,(x,W,H)=>{x.fillStyle='#fff6e2';roundRect(x,6,6,W-12,H-12,26);x.fill();x.lineWidth=10;x.strokeStyle='#2a1d17';x.stroke();x.direction='rtl';x.textAlign='center';x.fillStyle='#2a1d17';x.font='800 76px Rubik, Assistant, sans-serif';x.fillText(title,W/2,sub?120:150);if(sub){x.font='600 40px Assistant, Rubik, sans-serif';x.fillStyle='#7a6a5c';x.fillText(sub,W/2,190)}});
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide}));
  return m;
}

// Ground, roads, blocks
const ground=new THREE.Mesh(new THREE.PlaneGeometry(900,900),M(0x7cb85a));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const span=(G+0.5)*P;
const roadMat=M(0x8f8d93);
for(let k=-G-1;k<=G;k++){
  const p=(k+0.5)*P;
  const rx=new THREE.Mesh(new THREE.BoxGeometry(P-BLOCK,0.1,span*2+4),roadMat);rx.position.set(p,0.05,0);rx.receiveShadow=true;scene.add(rx);
  const rz=new THREE.Mesh(new THREE.BoxGeometry(span*2+4,0.1,P-BLOCK),roadMat);rz.position.set(0,0.09,p);rz.receiveShadow=true;scene.add(rz);
}
// lane dashes
{
  const dashes=[];for(let k=-G-1;k<=G;k++){const p=(k+0.5)*P;for(let t=-span;t<=span;t+=4.5){if(Math.abs(((t%P)+P)%P-P/2)<3)continue;dashes.push([p,t,0],[t,p,1])}}
  const dm=new THREE.InstancedMesh(new THREE.BoxGeometry(0.28,0.04,1.8),new THREE.MeshBasicMaterial({color:0xf6c945}),dashes.length);
  const o=new THREE.Object3D();dashes.forEach((d,i)=>{o.position.set(d[0],0.19,d[1]);o.rotation.y=d[2]?Math.PI/2:0;o.updateMatrix();dm.setMatrixAt(i,o.matrix)});scene.add(dm);
}
// blocks: sidewalk + lawn
const isLM=(i,j)=>Math.abs(i)<=1&&Math.abs(j)<=1;
const blocks=[];for(let i=-G;i<=G;i++)for(let j=-G;j<=G;j++)blocks.push([i,j]);
{
  const side=new THREE.InstancedMesh(new THREE.BoxGeometry(BLOCK+1.2,0.3,BLOCK+1.2),M(0xe9dfc6),blocks.length);
  const lawn=new THREE.InstancedMesh(new THREE.BoxGeometry(BLOCK-0.6,0.36,BLOCK-0.6),M(0x86c45c),blocks.length);
  const o=new THREE.Object3D();
  blocks.forEach(([i,j],n)=>{o.position.set(i*P,0.15,j*P);o.updateMatrix();side.setMatrixAt(n,o.matrix);o.position.y=0.2;o.updateMatrix();lawn.setMatrixAt(n,o.matrix)});
  side.receiveShadow=lawn.receiveShadow=true;scene.add(side,lawn);
}
// slots, growing outward ring by ring
const OFF=[[3.6,3.6],[-3.6,3.6],[-3.6,-3.6],[3.6,-3.6]];
const slots=[];
blocks.filter(([i,j])=>!isLM(i,j)).forEach(([i,j])=>OFF.forEach(([ox,oz])=>{
  const x=i*P+ox,z=j*P+oz;slots.push({x,z,yaw:Math.atan2(ox,oz),ring:Math.max(Math.abs(i),Math.abs(j)),ang:Math.atan2(z,x)});
}));
slots.sort((a,b)=>a.ring-b.ring||a.ang-b.ang);
const CAP=slots.length;

// ===== Landmarks =====
const anim=[];
// Central plaza: covers the 3x3 middle blocks
{
  const plaza=new THREE.Mesh(new THREE.BoxGeometry(3*P-4,.6,3*P-4),new THREE.MeshStandardMaterial({color:0xf3e7cb,roughness:.9}));plaza.position.y=.3;plaza.receiveShadow=true;scene.add(plaza);
  [24,26.5].forEach((r,k)=>{const ring=new THREE.Mesh(new THREE.RingGeometry(r-.6,r,96),new THREE.MeshStandardMaterial({color:k?0xe0c995:0xd9bd84,roughness:.9}));ring.rotation.x=-Math.PI/2;ring.position.y=.66;scene.add(ring)});
}

// Mount Shakshuka: a volcano rising out of a giant skillet
const VH=17, VB=3.2; // volcano height, base level (pan sauce surface)
const volcano=new THREE.Group();
function vr(y){return 4+10.5*Math.pow(1-y/VH,1.7)}
{
  // giant skillet
  const metal=new THREE.MeshStandardMaterial({color:0x2a292c,metalness:.65,roughness:.32});
  const pan=new THREE.Mesh(new THREE.CylinderGeometry(21.5,19.8,3,96),metal);pan.position.y=2.1;pan.castShadow=pan.receiveShadow=true;volcano.add(pan);
  const rim=new THREE.Mesh(new THREE.TorusGeometry(21.4,.55,12,96),metal);rim.rotation.x=Math.PI/2;rim.position.y=3.6;volcano.add(rim);
  const handle=new THREE.Mesh(new THREE.BoxGeometry(10,1.2,2.6),metal);handle.position.set(-17.5,3,-17.5);handle.rotation.y=-Math.PI/4;handle.castShadow=true;volcano.add(handle);
  const grip=new THREE.Mesh(new THREE.TorusGeometry(.7,.22,8,20),metal);grip.position.set(-20.6,3.65,-20.6);grip.rotation.x=Math.PI/2;volcano.add(grip);
  // sauce pool
  const pool=new THREE.Mesh(new THREE.CylinderGeometry(20.9,20.9,.4,96),new THREE.MeshPhysicalMaterial({color:0xcf3a1f,roughness:.28,clearcoat:.6,clearcoatRoughness:.3,emissive:0x5a1006,emissiveIntensity:.25}));pool.position.y=3.15;volcano.add(pool);
  anim.push(t=>{pool.material.emissiveIntensity=.22+Math.sin(t*1.4)*.06});

  // volcano body: lathe profile with rocky noise and a heat gradient
  const prof=[];for(let y=0;y<=VH;y+=.5)prof.push(new THREE.Vector2(vr(y),y));
  prof.push(new THREE.Vector2(4.7,VH+.35),new THREE.Vector2(4.3,VH+.6),new THREE.Vector2(3.7,VH+.3),new THREE.Vector2(3.3,VH-.5),new THREE.Vector2(0,VH-.5));
  const lg=new THREE.LatheGeometry(prof,96);
  const p=lg.attributes.position,cc=[],c1=new THREE.Color(0x5e1d10),c2=new THREE.Color(0xa8301a),c3=new THREE.Color(0xe8572a),tmp=new THREE.Color();
  for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),a=Math.atan2(z,x),r=Math.hypot(x,z);
    const n=1+(y<VH-.2?.055*Math.sin(a*7+y*.9)+.035*Math.sin(a*15-y*1.6)+.02*Math.sin(a*31+y*3):0);
    p.setX(i,x*n);p.setZ(i,z*n);
    const t=Math.min(1,y/VH);if(t<.55)tmp.copy(c1).lerp(c2,t/.55);else tmp.copy(c2).lerp(c3,(t-.55)/.45);
    tmp.offsetHSL(0,0,(Math.sin(a*9+y*2)*.03));cc.push(tmp.r,tmp.g,tmp.b)}
  lg.setAttribute('color',new THREE.Float32BufferAttribute(cc,3));lg.computeVertexNormals();
  const body=new THREE.Mesh(lg,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.78}));body.position.y=VB;body.castShadow=true;body.receiveShadow=true;volcano.add(body);

  // glowing lava streams down the slopes
  const lavaMat=new THREE.MeshStandardMaterial({color:0xff6a2a,emissive:0xd83a10,emissiveIntensity:.6,roughness:.4});
  anim.push(t=>{lavaMat.emissiveIntensity=.5+Math.sin(t*3)*.18});
  for(let k=0;k<6;k++){const a0=k/6*Math.PI*2+.4,pts=[];

  const MR='/*'+'RES*/',MS='/*'+'SET*/';
  const msg=$('msg');msg.textContent='';msg.style.color='';
  if(window.claude){msg.textContent='התושבים נוספו בתצוגה. שמירה לכל המבקרים עובדת באתר שמפורסם באינטרנט (Vercel או Netlify).';return}
  let src;try{src=await (await fetch(location.href.split('#')[0],{cache:'no-store'})).text()}catch(e){msg.textContent='לא הצלחתי לקרוא את האתר. נסו שוב.';return}
  const r=src.split(MR),st=src.split(MS);
  if(r.length!==3||st.length!==3){msg.textContent='משהו בקובץ השתנה, אי אפשר לשמור.';return}
  src=r[0]+MR+JSON.stringify(residents.map(x=>x.name))+MR+r[2];
  const st2=src.split(MS);src=st2[0]+MS+JSON.stringify({party:settings.party,title:settings.title,theme:settings.theme})+MS+st2[2];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([src],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();a.remove();
  msg.style.color='#3f8f3a';msg.textContent='הקובץ ירד. עכשיו מעלים אותו ל-Netlify במקום הישן.';
}

let cloudBusy=false,cloudKey='';
async function cloudCall(method='GET',body){
 const headers={'Content-Type':'application/json'};
 if(method==='PATCH'){
  if(!cloudKey)cloudKey=prompt('הכנס קוד ניהול ענן (הקוד שהגדרת ב-Vercel):')||'';
  if(!cloudKey)throw new Error('לא הוזן קוד ניהול');
  headers['x-city-admin']=cloudKey;
 }
 const response=await fetch('/api/city',{method,headers,body:body?JSON.stringify(body):undefined,cache:'no-store'});
 if(!response.ok){if(response.status===403)cloudKey='';throw new Error('שמירה בענן נכשלה ('+response.status+')')}
 return response.json();
}
async function cloudRefresh(){
 if(cloudBusy)return;
 try{
  const data=await cloudCall();
  if(!Array.isArray(data.residents))throw new Error('missing residents');
  const list=data.residents.map((r,i)=>({id:String(r.id||i),name:cleanName(r.name),at:Number(r.at)||i})).sort((a,b)=>a.at-b.at);
  const had=initialLoaded;
  initialLoaded=true;
  onResidents(list,had);
  const v=data.settings||{};
  applySettings({party:!!v.party,title:String(v.title||''),theme:THEMES[v.theme]?v.theme:'day'});
  setNote('');
  if(!residents.some(r=>r.id===myId)) maybeWelcome();
 }catch(err){setNote('אין חיבור לשמירה בענן. שינויים חדשים לא יישמרו.')}
}
async function cloudWrite(method,body){
 cloudBusy=true;
 try{const data=await cloudCall(method,body);await cloudRefreshAfter(data);return true}
 catch(err){$('msg').textContent=err.message;return false}
 finally{cloudBusy=false}
}
async function cloudRefreshAfter(data){
 const list=(data.residents||[]).map(r=>({id:r.id,name:cleanName(r.name),at:r.at})).sort((a,b)=>a.at-b.at);
 onResidents(list,true);
 if(data.settings)applySettings({party:!!data.settings.party,title:data.settings.title||'',theme:THEMES[data.settings.theme]?data.settings.theme:'day'});
}

async function connect(){goStatic();await cloudRefresh();setInterval(cloudRefresh,8000);return;
  if(!window.claude||!window.claude.use){goLocal();return}
  db=await window.claude.use('db');
  if(!db){goGuest();return}
  try{user=await window.claude.use('user');if(user){myId=await user.id();canAdmin=await user.canEdit()}}catch(e){}
  if(!myId)myId='anon';
  $('openList').textContent=canAdmin?'ניהול':'תושבים';
  col=db.collection('residents');
  settingsRef=db.collection('settings').doc('city');
  settingsRef.onSnapshot(snap=>{const v=(snap.exists&&snap.data())||{};applySettings({party:!!v.party,title:String(v.title||'').slice(0,40),theme:THEMES[v.theme]?v.theme:'day'})},()=>{});
  const timer=setTimeout(()=>setNote('לא מצליח להגיע לרשימת התושבים כרגע'),10000);
  col.orderBy('at').onSnapshot(snap=>{
    const list=snap.docs.map(d=>{const v=d.data()||{};return{id:d.id,name:cleanName(v.name),at:v.at||0}}).filter(r=>r.name);
    list.forEach(r=>{const old=residents.find(x=>x.id===r.id&&x.name===r.name);if(old)r._info=old._info});
    const first=!initialLoaded;
    if(!snap.metadata.fromCache){clearTimeout(timer);initialLoaded=true;setNote('')}
    if(first&&!snap.metadata.fromCache){knownIds=new Set(list.map(r=>r.id));residents=list;render();maybeWelcome();return}
    onResidents(list,initialLoaded);
  },err=>{clearTimeout(timer);goGuest()});
}

// ===== Camera (orbit: drag to turn, pinch or wheel to zoom) =====
const cam={target:new THREE.Vector3(0,8,0),theta:.65,phi:.92,radius:110};
let fly=null;
function flyToSlot(i,zoom){const s=slots[i];if(!s)return;fly={t0:performance.now(),dur:1600,from:cam.target.clone(),to:new THREE.Vector3(s.x,2,s.z),r0:cam.radius,r1:zoom?30:Math.min(Math.max(cam.radius,45),70),p0:cam.phi,p1:.85}}
const ptrs=new Map();let pinch0=0,r0=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});fly=null;if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);r0=cam.radius}});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
  if(ptrs.size===1){cam.theta-=(e.clientX-p.x)*.006;cam.phi=Math.min(1.35,Math.max(.25,cam.phi-(e.clientY-p.y)*.005))}
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0)cam.radius=Math.min(230,Math.max(18,r0*pinch0/d))}});
function up(e){ptrs.delete(e.pointerId);pinch0=0}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.radius=Math.min(230,Math.max(18,cam.radius*(1+e.deltaY*.001)))},{passive:false});

// Film mode
let film=false;
$('film').onclick=e=>{e.stopPropagation();film=true;document.body.classList.add('film');$('filmhint').hidden=false;sheet.hidden=true;fly={t0:performance.now(),dur:2000,from:cam.target.clone(),to:new THREE.Vector3(0,8,0),r0:cam.radius,r1:100,p0:cam.phi,p1:.9};setTimeout(()=>{$('filmhint').hidden=true},2500)};
canvas.addEventListener('click',()=>{if(film){film=false;document.body.classList.remove('film');$('filmhint').hidden=true}});

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?60:45;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock=new THREE.Clock();
function ease(t){const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}
function loop(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime,now=performance.now();
  if(film&&!fly)cam.theta+=dt*.12;
  if(fly){let k=Math.min(1,(now-fly.t0)/fly.dur);const s=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;cam.target.lerpVectors(fly.from,fly.to,s);cam.radius=fly.r0+(fly.r1-fly.r0)*s;cam.phi=fly.p0+(fly.p1-fly.p0)*s;if(k>=1)fly=null}
  const sp=Math.sin(cam.phi);
  camera.position.set(cam.target.x+cam.radius*sp*Math.sin(cam.theta),cam.target.y+cam.radius*Math.cos(cam.phi),cam.target.z+cam.radius*sp*Math.cos(cam.theta));
  camera.lookAt(cam.target);

  if(!reduce)anim.forEach(f=>f(t));
  if(!reduce)partyTick(t,dt);
  // pops
  if(pops.size){for(const [si,p] of pops){const k=Math.min(1,(now-p.t0)/900);writeHouse(si,p.info,Math.max(.05,ease(k)));if(k>=1)pops.delete(si)}flushHouses()}
  // eruption
  if(!reduce&&t>nextErupt){erupt();nextErupt=t+2.2+Math.random()*1.5}
  for(let i=blobs.length-1;i>=0;i--){const b=blobs[i];b.userData.v.y-=22*dt;b.position.addScaledVector(b.userData.v,dt);if(b.position.y<VB+.2){scene.remove(b);blobs.splice(i,1)}}
  if(!reduce&&t>nextPuff&&puffs.length<26){const m=new THREE.Mesh(puffGeo,new THREE.MeshStandardMaterial({color:0xfff3ea,transparent:true,opacity:.5,roughness:1,depthWrite:false}));const a=Math.random()*6.28;m.position.set(Math.cos(a)*1.5,VB+VH+1,Math.sin(a)*1.5);m.userData={life:0,v:new THREE.Vector3((Math.random()-.5)*1.2,3+Math.random()*1.5,(Math.random()-.5)*1.2)};scene.add(m);puffs.push(m);nextPuff=t+.28}
  for(let i=puffs.length-1;i>=0;i--){const m=puffs[i],u=m.userData;u.life+=dt;m.position.addScaledVector(u.v,dt);const s=1+u.life*1.1;m.scale.set(s,s,s);m.material.opacity=Math.max(0,.5*(1-u.life/4.5));if(u.life>4.5){scene.remove(m);m.material.dispose();puffs.splice(i,1)}}
  // fountain drops
  if(!reduce&&drops.length<70){const d=new THREE.Mesh(dropGeo,dropMat);const a=Math.random()*6.28,s=1.5+Math.random();d.position.set(fountainPos.x,7,fountainPos.z);d.userData.v=new THREE.Vector3(Math.cos(a)*s,4+Math.random()*2,Math.sin(a)*s);scene.add(d);drops.push(d)}
  for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.userData.v.y-=14*dt;d.position.addScaledVector(d.userData.v,dt);if(d.position.y<1.2){scene.remove(d);drops.splice(i,1)}}
  // cars
  if(!reduce)cars.forEach(c=>{const u=c.userData;u.t+=u.dir*u.sp*dt;if(u.t>span)u.t=-span;if(u.t<-span)u.t=span;if(u.alongX){c.position.set(u.t,0,u.lane);c.rotation.y=u.dir>0?Math.PI/2:-Math.PI/2}else{c.position.set(u.lane,0,u.t);c.rotation.y=u.dir>0?0:Math.PI}});
  // label fade by distance
  for(const sp of labels.values()){const d=sp.position.distanceTo(camera.position);sp.material.opacity=d<150?1:Math.max(0,1-(d-150)/60);sp.visible=sp.material.opacity>0.02}
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
render();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{for(const [k,sp] of labels){scene.remove(sp);sp.material.map.dispose();sp.material.dispose()}labels.clear();render()});
loop();
connect();
})();
</script>
