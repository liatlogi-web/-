  <div class="list" id="list"></div>
</div>

<div class="pad" id="pad" aria-label="טיול בעיר">
  <button type="button" data-d="u" aria-label="קדימה">▲</button>
  <button type="button" data-d="l" aria-label="שמאלה">◀</button>
  <button type="button" data-d="r" aria-label="ימינה">▶</button>

<div class="toast" id="toast"></div>
<div class="welcome" id="adminGate" hidden>
  <form class="wcard" id="gateForm" autocomplete="off">

</div>
<div class="welcome" id="welcome" hidden>

</div>
<div class="filmhint" id="filmhint" hidden>לחיצה על המסך יוצאת ממצב צילום</div>

{

{

async function cloudCall(method='GET',body){
 const headers={'Content-Type':'application/json'};
 if(method!=='GET'){
  if(!cloudKey){needKey();throw new Error('קודם הקלידו את קוד הניהול למעלה ולחצו "חיבור".')}
  headers['x-city-admin']=cloudKey;
 }
 const response=await fetch('/api/city',{method,headers,body:body?JSON.stringify(body):undefined,cache:'no-store'});
 if(!response.ok){
  if(response.status===403){cloudKey='';try{localStorage.removeItem('sc_city_key')}catch(e){}keyState('קוד הניהול לא נכון. נסו שוב.','bad');needKey();throw new Error('קוד הניהול לא נכון.')}
  if(response.status===503){keyState('ב-Vercel עוד לא הוגדר קוד ניהול (CITY_ADMIN_KEY).','bad');throw new Error('ב-Vercel עוד לא הוגדר קוד ניהול.')}
  if(response.status===409)throw new Error('העיר מלאה, או שמישהו שמר בדיוק עכשיו. נסו שוב.');
  throw new Error('השמירה בענן נכשלה ('+response.status+'). נסו שוב בעוד רגע.');
 }
 return response.json();
}

async function cloudRefresh(){

 try{
  const data=await cloudCall();
  if(!Array.isArray(data.residents))throw new Error('missing residents');
  const list=data.residents.map((r,i)=>({id:String(r.id||i),name:cleanName(r.name),at:Number(r.at)||i})).sort((a,b)=>a.at-b.at);
  const had=initialLoaded;
  initialLoaded=true;
  onResidents(list,had);
  const v=data.settings||{};
  applySettings({party:!!v.party,title:String(v.title||''),theme:THEMES[v.theme]?v.theme:'day',reveal:v.reveal||settings.reveal||STATIC_SETTINGS.reveal||''});
  setNote('');
  if(!residents.some(r=>r.id===myId)) maybeWelcome();
 }catch(err){setNote('אין חיבור לשמירה בענן. שינויים חדשים לא יישמרו.')}
}
async function cloudWrite(method,body){

 try{const data=await cloudCall(method,body);await cloudRefreshAfter(data);return true}
 catch(err){const m=$('msg');m.style.color='';m.textContent=err.message;toast('לא נשמר',err.message);return false}
 finally{cloudBusy=false}
}

 onResidents(list,true);
 if(data.settings)applySettings({party:!!data.settings.party,title:data.settings.title||'',theme:THEMES[data.settings.theme]?data.settings.theme:'day',reveal:data.settings.reveal||settings.reveal||STATIC_SETTINGS.reveal||''});

async function connect(){goStatic();await cloudRefresh();setInterval(cloudRefresh,8000);return;
  if(!window.claude||!window.claude.use){goLocal();return}
  db=await window.claude.use('db');
  if(!db){goGuest();return}
  try{user=await window.claude.use('user');if(user){myId=await user.id();canAdmin=await user.canEdit()}}catch(e){}
  if(!myId)myId='anon';
  $('openList').textContent=canAdmin?'ניהול':'תושבים';
  col=db.collection('residents');
  settingsRef=db.collection('settings').doc('city');
  settingsRef.onSnapshot(snap=>{const v=(snap.exists&&snap.data())||{};applySettings({party:!!v.party,title:String(v.title||'').slice(0,40),theme:THEMES[v.theme]?v.theme:'day'})},()=>{});
  const timer=setTimeout(()=>setNote('לא מצליח להגיע לרשימת התושבים כרגע'),10000);
  col.orderBy('at').onSnapshot(snap=>{
    const list=snap.docs.map(d=>{const v=d.data()||{};return{id:d.id,name:cleanName(v.name),at:v.at||0}}).filter(r=>r.name);
    list.forEach(r=>{const old=residents.find(x=>x.id===r.id&&x.name===r.name);if(old)r._info=old._info});
    const first=!initialLoaded;
    if(!snap.metadata.fromCache){clearTimeout(timer);initialLoaded=true;setNote('')}
    if(first&&!snap.metadata.fromCache){knownIds=new Set(list.map(r=>r.id));residents=list;render();maybeWelcome();return}
    onResidents(list,initialLoaded);
  },err=>{clearTimeout(timer);goGuest()});
}

  const off=()=>{walk[d]=0;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);b.addEventListener('contextmenu',e=>e.preventDefault())});
addEventListener('keydown',e=>{if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code)){keys[e.code]=true;e.preventDefault()}});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;for(const k in walk)walk[k]=0});

// Film mode
let film=false;
$('film').onclick=e=>{e.stopPropagation();film=true;document.body.classList.add('film');$('filmhint').hidden=false;sheet.hidden=true;fly={t0:performance.now(),dur:2000,from:cam.target.clone(),to:new THREE.Vector3(0,8,0),r0:cam.radius,r1:100,p0:cam.phi,p1:.9};setTimeout(()=>{$('filmhint').hidden=true},2500)};
canvas.addEventListener('click',()=>{if(film){film=false;document.body.classList.remove('film');$('filmhint').hidden=true}});

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?60:45;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock=new THREE.Clock();
function ease(t){const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}
function loop(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime,now=performance.now();
  if(film&&!fly)cam.theta+=dt*.12;
  {const f=(walk.u||keys.ArrowUp||keys.KeyW?1:0)-(walk.d||keys.ArrowDown||keys.KeyS?1:0),r=(walk.r||keys.ArrowRight||keys.KeyD?1:0)-(walk.l||keys.ArrowLeft||keys.KeyA?1:0);
   if(f||r){fly=null;const sp=Math.max(12,cam.radius*.7)*dt,st=Math.sin(cam.theta),ct=Math.cos(cam.theta);
     cam.target.x+=(-st*f+ct*r)*sp;cam.target.z+=(-ct*f-st*r)*sp;
     cam.target.x=Math.max(-170,Math.min(170,cam.target.x));cam.target.z=Math.max(-120,Math.min(210,cam.target.z))}}
  if(fly){let k=Math.min(1,(now-fly.t0)/fly.dur);const s=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;cam.target.lerpVectors(fly.from,fly.to,s);cam.radius=fly.r0+(fly.r1-fly.r0)*s;cam.phi=fly.p0+(fly.p1-fly.p0)*s;if(fly.th1!=null)cam.theta=fly.th0+(fly.th1-fly.th0)*s;if(k>=1)fly=null}
  const sp=Math.sin(cam.phi);
  camera.position.set(cam.target.x+cam.radius*sp*Math.sin(cam.theta),cam.target.y+cam.radius*Math.cos(cam.phi),cam.target.z+cam.radius*sp*Math.cos(cam.theta));
  camera.lookAt(cam.target);

  if(!reduce)anim.forEach(f=>f(t));
  if(!reduce)partyTick(t,dt);
  revealTick(t,dt);
  // pops
  if(pops.size){for(const [si,p] of pops){const k=Math.min(1,(now-p.t0)/900);writeHouse(si,p.info,Math.max(.05,ease(k)));if(k>=1)pops.delete(si)}flushHouses()}
  // eruption
  if(!reduce&&t>nextErupt){erupt();nextErupt=t+2.2+Math.random()*1.5}
  for(let i=blobs.length-1;i>=0;i--){const b=blobs[i];b.userData.v.y-=22*dt;b.position.addScaledVector(b.userData.v,dt);if(b.position.y<VB+.2){scene.remove(b);blobs.splice(i,1)}}
  if(!reduce&&t>nextPuff&&puffs.length<26){const m=new THREE.Mesh(puffGeo,new THREE.MeshStandardMaterial({color:0xfff3ea,transparent:true,opacity:.5,roughness:1,depthWrite:false}));const a=Math.random()*6.28;m.position.set(Math.cos(a)*1.5,VB+VH+1,Math.sin(a)*1.5);m.userData={life:0,v:new THREE.Vector3((Math.random()-.5)*1.2,3+Math.random()*1.5,(Math.random()-.5)*1.2)};scene.add(m);puffs.push(m);nextPuff=t+.28}
  for(let i=puffs.length-1;i>=0;i--){const m=puffs[i],u=m.userData;u.life+=dt;m.position.addScaledVector(u.v,dt);const s=1+u.life*1.1;m.scale.set(s,s,s);m.material.opacity=Math.max(0,.5*(1-u.life/4.5));if(u.life>4.5){scene.remove(m);m.material.dispose();puffs.splice(i,1)}}
  // fountain drops
  if(!reduce&&drops.length<70){const d=new THREE.Mesh(dropGeo,dropMat);const a=Math.random()*6.28,s=1.5+Math.random();d.position.set(fountainPos.x,7,fountainPos.z);d.userData.v=new THREE.Vector3(Math.cos(a)*s,4+Math.random()*2,Math.sin(a)*s);scene.add(d);drops.push(d)}
  for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.userData.v.y-=14*dt;d.position.addScaledVector(d.userData.v,dt);if(d.position.y<1.2){scene.remove(d);drops.splice(i,1)}}
  // cars
  if(!reduce)cars.forEach(c=>{const u=c.userData;u.t+=u.dir*u.sp*dt;if(u.t>span)u.t=-span;if(u.t<-span)u.t=span;if(u.alongX){c.position.set(u.t,0,u.lane);c.rotation.y=u.dir>0?Math.PI/2:-Math.PI/2}else{c.position.set(u.lane,0,u.t);c.rotation.y=u.dir>0?0:Math.PI}});
  // label fade by distance
  for(const sp of labels.values()){const d=sp.position.distanceTo(camera.position);sp.material.opacity=d<150?1:Math.max(0,1-(d-150)/60);sp.visible=sp.material.opacity>0.02}
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
render();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{for(const [k,sp] of labels){scene.remove(sp);sp.material.map.dispose();sp.material.dispose()}labels.clear();render()});
loop();
connect();
})();
</script>

</body></html>
